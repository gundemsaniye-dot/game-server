buffers: { size_kb: 32768 fill_policy: RING_BUFFER }
duration_ms: 60000
data_sources: {
  config {
    name: "linux.ftrace"
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_wakeup"
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "power/gpu_frequency"
      atrace_categories: "gfx"
      atrace_categories: "view"
      atrace_categories: "webview"
      atrace_categories: "freq"
      atrace_apps: "com.castlestormers.game"
      atrace_apps: "com.castlestormers.game.perf"
    }
  }
}
data_sources: { config { name: "android.gpu.memory" } }
data_sources: { config { name: "linux.process_stats" target_buffer: 0 process_stats_config { scan_all_processes_on_start: true proc_stats_poll_ms: 1000 } } }
data_sources: { config { name: "android.surfaceflinger.frame" } }
data_sources: { config { name: "android.surfaceflinger.frametimeline" } }
